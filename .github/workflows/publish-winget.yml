name: Publish release to WinGet
# Upstream submits Feishin to the Windows package manager on every release.
# This fork does not ship to winget, so it never fires on its own.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Specific tag name"
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: jeffvli.Feishin
          installers-regex: 'Feishin-*-win-(x64|arm64)\.exe'
          token: ${{ secrets.WINGET_ACC_TOKEN }}
