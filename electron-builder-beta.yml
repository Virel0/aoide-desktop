appId: com.gabereglat.aoide.desktop
productName: Aoide
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
electronVersion: 41.7.0
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - 'package.json'
extraResources:
    - assets/**
asarUnpack:
    - resources/**
win:
    target:
        - target: zip
          arch:
              - x64
              - arm64
        - target: nsis
          arch:
              - x64
              - arm64
    icon: assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    target:
        - target: dmg
          arch:
              - arm64
              - x64
        - target: zip
          arch:
              - arm64
              - x64
    icon: media/feishin.icon
    type: distribution
    hardenedRuntime: false
    identity: '-'
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in Aoide'
        NSLocalNetworkUsageDescription: 'Local network is necessary for accessing servers hosted on the same system as Aoide'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    executableName: aoide
    target:
        - AppImage
        - deb
        - tar.xz
    category: AudioVideo;Audio;Player
    icon: assets/icons/icon.png
    artifactName: ${productName}-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.3'

npmRebuild: false
publish:
    provider: github
    owner: Virel0
    repo: aoide-desktop
    channel: beta
    releaseType: draft
